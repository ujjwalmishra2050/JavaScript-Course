<body>
    <button id="btn1">
        Start
    </button>
    <button id="btn2">
        Stop
    </button>
    <h1>Ujjwal Mishra</h1>

    <script>
        let SayMYname = function() {
            console.log("Ujjwal");
        }

        let id; // simple variable to store interval ID

        document.querySelector('#btn1').addEventListener('click', function() {
            id = setInterval(SayMYname, 1000);
        });

        document.querySelector('#btn2').addEventListener('click', function() {
            clearInterval(id); // use the stored ID to stop
            console.log("Stopped");
        });
    </script>
</body>
