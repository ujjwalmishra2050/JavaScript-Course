<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DOM Manipulation</title>
</head>
<body style="">
    <script>
      let myele=  document.createElement('div')
      console.log(myele);
      myele.id = Math.random() * 10
      myele.className="Ujjwal"
      myele.style.backgroundColor="red"
      myele.setAttribute =("title" , "Ujjwal")
      let documentText = document.createTextNode("Prograamming Is Best")
      myele.appendChild(documentText)
      document.body.appendChild(myele)
      
    </script>
</body>
</html>
