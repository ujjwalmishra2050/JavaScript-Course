<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async HTML</title>
</head>
<body>
    <button id="btn1">
          Start
    </button>
    <button id = "btn2">
        Stop
    </button>
<h1>Ujjwal Mishra </h1>
    <Script>
        let Saymyname = function(){
            console.log("Ujjwal");
        }
        let id;
   document.querySelector('#btn1').addEventListener('click',function()
   {
   id = setInterval(Saymyname ,1000);
   })

   document.querySelector('#btn2').addEventListener('click' ,function(){
    clearInterval(id);
    console.log("Stopped");
   })
    </Script>

</body>
</html>
